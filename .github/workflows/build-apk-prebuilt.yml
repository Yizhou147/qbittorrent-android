name: Build APK (prebuilt native libs)

# 方案A: 使用仓库 jniLibs 中已验证可用的 v1.1 原生库 (Qt5 + libqbt + libtorrent
# + openssl), 不做任何原生编译, 只打 APK。用于快速产出确定可用的 4.6.7。
# 原生库全量重编见 build-android.yml / build-qt.yml (方案B)。

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'APK 版本后缀 (默认 prebuilt)'
        required: false
        default: 'prebuilt'

concurrency:
  group: prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK from prebuilt libs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prebuilt libs
        run: |
          JNILIBS=apk-project/app/src/main/jniLibs/arm64-v8a
          for f in libqbt.so libtorrent-rasterbar.so libc++_shared.so \
                   libQt5Core_arm64-v8a.so libQt5Network_arm64-v8a.so \
                   libQt5Sql_arm64-v8a.so libQt5Xml_arm64-v8a.so \
                   libssl.so libcrypto.so; do
            test -f "$JNILIBS/$f" || { echo "缺少 $f"; exit 1; }
          done
          ls -lh "$JNILIBS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认装 'tools platform-tools', 但 Google 已下线 'tools' 包,
          # 会以 "Failed to find package 'tools'" + 退出码 1 失败, 故显式指定存在的包
          packages: 'platform-tools'

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.QBT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 QBT_KEYSTORE_BASE64, 本次回退 debug 签名 (这样的包无法互相覆盖安装)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "QBT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "QBT_KEYSTORE_PASSWORD=${{ secrets.QBT_KEYSTORE_PASSWORD }}"
            echo "QBT_KEY_ALIAS=${{ secrets.QBT_KEY_ALIAS }}"
            echo "QBT_KEY_PASSWORD=${{ secrets.QBT_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "已注入正式签名配置"

      - name: Build APK (v467 flavor)
        run: |
          cd apk-project
          chmod +x gradlew
          ./gradlew assembleV467Release

      - name: Rename APK
        run: |
          mv apk-project/app/build/outputs/apk/v467/release/app-v467-release.apk \
             qbittorrent-android-qb4.6.7-${{ inputs.version_tag }}.apk

      - name: Verify APK signature and package id
        run: |
          APK="qbittorrent-android-qb4.6.7-${{ inputs.version_tag }}.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6
          echo "expected package id: com.qbittorrent.android.qb467"
          "$AAPT" dump packagename "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-android-qb4.6.7
          path: qbittorrent-android-qb4.6.7-${{ inputs.version_tag }}.apk
          retention-days: 90
