name: Build legacy qBittorrent Android APK (Android 9+)

# 面向 Android 9 (API 28) 的老设备。与 build-android.yml 完全独立：
#   - 仅手动触发，不响应 tag / release，不会影响现有发布流程
#   - 原生构建使用 Docker LEGACY_UNWIND=1（libqbt 静态链接 libunwind）
#   - Gradle 使用 -PlegacyBuild（minSdk 28 + versionName 后缀 -legacy）
#   - 只构建 4.3.9 (Qt5) 与 5.3.0 (Qt6)
#
# 背景: 普通包的 libqbt.so 依赖 API 30 才导出的 _Unwind_*，在 Android 10 及以下
# 加载即失败（表现为一直停在“正在启动”）。详见 README「关键技术问题 9」。

on:
  workflow_dispatch:
    inputs:
      qb_version:
        description: 'qBittorrent 版本 (all = 4.3.9 + 5.3.0)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '4.3.9'
          - '5.3.0'
  # 临时: 新工作流在默认分支注册前无法 dispatch，先允许 dev push 触发一次；
  # 首轮验证结束后删除这两行。
  push:
    branches:
      - dev

concurrency:
  group: build-legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare legacy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          requested="${{ inputs.qb_version }}"
          if [ -z "$requested" ] || [ "$requested" = "all" ]; then
            echo 'matrix={"version":["4.3.9","5.3.0"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"version\":[\"$requested\"]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build legacy (qBittorrent ${{ matrix.version }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QT5_VERSION: 5.15.2
      QT6_VERSION: 6.6.3
      LEGACY_MIN_SDK: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Resolve variant parameters
        id: params
        run: |
          case "${{ matrix.version }}" in
            4.3.9)
              echo "qbt_ref=release-4.3.9"        >> $GITHUB_OUTPUT
              echo "lt_ref=v1.2.20"               >> $GITHUB_OUTPUT
              echo "qt_kind=qt5"                  >> $GITHUB_OUTPUT
              echo "qt_version=$QT5_VERSION"      >> $GITHUB_OUTPUT
              echo "cxx_standard=17"              >> $GITHUB_OUTPUT
              echo "extra_flags=-DSTACKTRACE=OFF" >> $GITHUB_OUTPUT
              echo "extra_lt_flags=-Wno-error=c++11-narrowing-const-ref -Wno-error=c++11-narrowing" >> $GITHUB_OUTPUT
              echo "flavor=v439"                   >> $GITHUB_OUTPUT
              echo "app_id=com.qbittorrent.android.qb439" >> $GITHUB_OUTPUT
              ;;
            5.3.0)
              echo "qbt_ref=release-5.3.0"        >> $GITHUB_OUTPUT
              echo "lt_ref=v2.0.14"               >> $GITHUB_OUTPUT
              echo "qt_kind=qt6"                  >> $GITHUB_OUTPUT
              echo "qt_version=$QT6_VERSION"      >> $GITHUB_OUTPUT
              echo "cxx_standard=20"              >> $GITHUB_OUTPUT
              echo "extra_flags=-DSTACKTRACE=OFF" >> $GITHUB_OUTPUT
              echo "extra_lt_flags="              >> $GITHUB_OUTPUT
              echo "flavor=v530"                  >> $GITHUB_OUTPUT
              echo "app_id=com.qbittorrent.android.qb530" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "legacy 只支持 4.3.9 / 5.3.0, 收到: ${{ matrix.version }}" >&2
              exit 1
              ;;
          esac

      - name: Download build dependencies
        run: |
          mkdir -p docker-sources

          echo "Downloading SDK Platform 34..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/platform-34-ext7_r02.zip \
            "https://dl.google.com/android/repository/platform-34-ext7_r02.zip"

          echo "Downloading Build Tools 34.0.0..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/build-tools_r34-linux.zip \
            "https://dl.google.com/android/repository/build-tools_r34-linux.zip"

          echo "Downloading NDK r27b..."
          curl -L --retry 3 --connect-timeout 120 -o docker-sources/android-ndk-r27b-linux.zip \
            "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip"

          echo "Downloading OpenSSL..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/openssl-3.3.2.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz" || \
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/openssl-3.3.2.tar.gz \
            "https://www.openssl.org/source/openssl-3.3.2.tar.gz"

          echo "Downloading Boost..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/boost_1_86_0.tar.gz \
            "https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz"

          echo "Downloading qBittorrent ${{ steps.params.outputs.qbt_ref }}..."
          curl -L --retry 3 --connect-timeout 60 \
            -o docker-sources/qbittorrent.tar.gz \
            "https://github.com/qbittorrent/qBittorrent/archive/refs/tags/${{ steps.params.outputs.qbt_ref }}.tar.gz"

          echo "Cloning libtorrent ${{ steps.params.outputs.lt_ref }}..."
          git clone --depth 1 --branch ${{ steps.params.outputs.lt_ref }} \
            --recursive --shallow-submodules \
            https://github.com/arvidn/libtorrent docker-sources/libtorrent

          ls -lh docker-sources/

      - name: Prepare source directories
        run: |
          mkdir -p docker-sources/qbittorrent
          tar xzf docker-sources/qbittorrent.tar.gz -C docker-sources/qbittorrent --strip-components=1
          bash ci/apply-patches.sh "${{ matrix.version }}" docker-sources/qbittorrent
          test -f docker-sources/qbittorrent/src/app/android_jni_bridge.cpp
          grep -q "add_library(qbt_app SHARED)" docker-sources/qbittorrent/src/app/CMakeLists.txt

      - name: Build Docker image (legacy unwinder)
        run: |
          docker build -t qbittorrent-android-legacy:${{ matrix.version }} \
            --build-arg QT_KIND=${{ steps.params.outputs.qt_kind }} \
            --build-arg QT_VERSION=${{ steps.params.outputs.qt_version }} \
            --build-arg CXX_STANDARD=${{ steps.params.outputs.cxx_standard }} \
            --build-arg EXTRA_CMAKE_FLAGS="${{ steps.params.outputs.extra_flags }}" \
            --build-arg EXTRA_LT_CXXFLAGS="${{ steps.params.outputs.extra_lt_flags }}" \
            --build-arg LEGACY_UNWIND=1 \
            .

      - name: Extract build artifacts
        run: |
          mkdir -p build-output
          docker create --name qb-legacy-out-${{ matrix.version }} qbittorrent-android-legacy:${{ matrix.version }}
          docker cp qb-legacy-out-${{ matrix.version }}:/output/lib/. ./build-output/
          docker rm qb-legacy-out-${{ matrix.version }}

          ls -lh build-output/
          ls build-output/libqbt*.so
          test -f build-output/libtorrent-rasterbar.so
          test -f build-output/libc++_shared.so

      - name: Prepare jniLibs
        run: |
          JNILIBS=apk-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNILIBS"
          rm -f "$JNILIBS"/lib*.so
          cp $(ls build-output/libqbt*.so | head -1) "$JNILIBS/libqbt.so"
          cp build-output/libtorrent-rasterbar.so "$JNILIBS/"
          cp build-output/libc++_shared.so "$JNILIBS/"
          THIRD=third-party/${{ steps.params.outputs.qt_kind }}/arm64-v8a
          test -d "$THIRD" || { echo "缺少 $THIRD"; exit 1; }
          cp "$THIRD"/*.so "$JNILIBS/"
          ls -lh "$JNILIBS"

      - name: Verify native library dependencies
        run: |
          JNILIBS=apk-project/app/src/main/jniLibs/arm64-v8a
          cd "$JNILIBS"
          QBT_LIB=$(ls libqbt*.so | head -1)
          readelf -d "$QBT_LIB" | grep NEEDED
          missing=0
          for lib in $(readelf -d "$QBT_LIB" | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
            case "$lib" in
              liblog.so|libdl.so|libm.so|libc.so|libz.so) continue ;;
            esac
            base="${lib%.so}"
            if [ ! -f "$lib" ] && [ ! -f "${base}_arm64-v8a.so" ]; then
              echo "MISSING: $lib"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Check legacy native compatibility
        run: |
          # 关键门禁: _Unwind_* 必须已定义；GLOBAL 未定义的 API>28 符号一律失败
          python3 ci/check-native-compat.py \
            apk-project/app/src/main/jniLibs/arm64-v8a \
            "$LEGACY_MIN_SDK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.QBT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 QBT_KEYSTORE_BASE64, 本次回退 debug 签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "QBT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "QBT_KEYSTORE_PASSWORD=${{ secrets.QBT_KEYSTORE_PASSWORD }}"
            echo "QBT_KEY_ALIAS=${{ secrets.QBT_KEY_ALIAS }}"
            echo "QBT_KEY_PASSWORD=${{ secrets.QBT_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "已注入正式签名配置"

      - name: Build APK (${{ steps.params.outputs.flavor }}, legacy)
        run: |
          cd apk-project
          chmod +x gradlew
          TASK="assemble$(echo '${{ steps.params.outputs.flavor }}' | sed 's/^v/V/')Release"
          echo "gradle task: $TASK -PlegacyBuild"
          ./gradlew "$TASK" -PlegacyBuild

      - name: Rename APK
        run: |
          FLAVOR="${{ steps.params.outputs.flavor }}"
          SRC="apk-project/app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release.apk"
          DST="qbittorrent-android-${{ matrix.version }}-legacy-${{ steps.version.outputs.version }}.apk"
          mv "$SRC" "$DST"
          echo "APK: $DST"

      - name: Verify APK metadata and signature
        run: |
          APK="qbittorrent-android-${{ matrix.version }}-legacy-${{ steps.version.outputs.version }}.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6
          echo "expected package id: ${{ steps.params.outputs.app_id }}"
          "$AAPT" dump packagename "$APK"
          echo "expected minSdk: $LEGACY_MIN_SDK"
          "$AAPT" dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|versionName"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-android-qb${{ matrix.version }}-legacy
          path: qbittorrent-android-${{ matrix.version }}-legacy-${{ steps.version.outputs.version }}.apk
          retention-days: 90
