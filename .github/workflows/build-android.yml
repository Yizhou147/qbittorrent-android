name: Build qBittorrent Android APK

on:
  workflow_dispatch:
    inputs:
      qb_version:
        description: 'qBittorrent 版本 (all = 全部构建)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '4.3.9'
          - '4.6.7'
          - '5.2.3'
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          requested="${{ inputs.qb_version }}"
          if [ -z "$requested" ] || [ "$requested" = "all" ]; then
            echo 'matrix={"version":["4.3.9","4.6.7","5.2.3"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"version\":[\"$requested\"]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (qBittorrent ${{ matrix.version }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # 每个变体的构建参数: qbittorrent / libtorrent / Qt / C++ 标准 / 额外 cmake 参数 / VueTorrent 版本
      # 4.3.9 需要 libtorrent 1.2.x 和 VueTorrent v0.13.0 (v1.0+ 要求 qb >= 4.4)
      # 5.2.3 需要 Qt6 >= 6.6 和 C++20
      QT5_VERSION: 5.15.2
      QT6_VERSION: 6.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Resolve variant parameters
        id: params
        run: |
          case "${{ matrix.version }}" in
            4.3.9)
              echo "qbt_ref=release-4.3.9"        >> $GITHUB_OUTPUT
              echo "lt_ref=v1.2.20"               >> $GITHUB_OUTPUT
              echo "qt_kind=qt5"                  >> $GITHUB_OUTPUT
              echo "qt_version=$QT5_VERSION"      >> $GITHUB_OUTPUT
              echo "cxx_standard=17"              >> $GITHUB_OUTPUT
              echo "extra_flags=-DSTACKTRACE=OFF" >> $GITHUB_OUTPUT
              # 新版 clang 将 narrowing 聚合初始化视为错误，1.2.x 源码有多处
              echo "extra_lt_flags=-Wno-error=c++11-narrowing-const-ref -Wno-error=c++11-narrowing" >> $GITHUB_OUTPUT
              ;;
            4.6.7)
              echo "qbt_ref=release-4.6.7"   >> $GITHUB_OUTPUT
              echo "lt_ref=v2.0.10"          >> $GITHUB_OUTPUT
              echo "qt_kind=qt5"             >> $GITHUB_OUTPUT
              echo "qt_version=$QT5_VERSION" >> $GITHUB_OUTPUT
              echo "cxx_standard=17"         >> $GITHUB_OUTPUT
              echo "extra_flags="            >> $GITHUB_OUTPUT
              echo "extra_lt_flags="         >> $GITHUB_OUTPUT
              ;;
            5.2.3)
              echo "qbt_ref=release-5.2.3"        >> $GITHUB_OUTPUT
              echo "lt_ref=v2.0.14"               >> $GITHUB_OUTPUT
              echo "qt_kind=qt6"                  >> $GITHUB_OUTPUT
              echo "qt_version=$QT6_VERSION"      >> $GITHUB_OUTPUT
              echo "cxx_standard=20"              >> $GITHUB_OUTPUT
              # rcc zstd 问题由 ci/patches/5.2.3/040-rcc-no-zstd.patch 处理
              echo "extra_flags=-DSTACKTRACE=OFF" >> $GITHUB_OUTPUT
              echo "extra_lt_flags="              >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown version: ${{ matrix.version }}" >&2
              exit 1
              ;;
          esac

      - name: Download build dependencies
        run: |
          mkdir -p docker-sources

          # Download Android SDK Platform 34
          echo "Downloading SDK Platform 34..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/platform-34-ext7_r02.zip \
            "https://dl.google.com/android/repository/platform-34-ext7_r02.zip"

          # Download Android Build Tools 34.0.0
          echo "Downloading Build Tools 34.0.0..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/build-tools_r34-linux.zip \
            "https://dl.google.com/android/repository/build-tools_r34-linux.zip"

          # Download Android NDK r27b
          echo "Downloading NDK r27b..."
          curl -L --retry 3 --connect-timeout 120 -o docker-sources/android-ndk-r27b-linux.zip \
            "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip"

          # Download OpenSSL
          echo "Downloading OpenSSL..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/openssl-3.3.2.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz" || \
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/openssl-3.3.2.tar.gz \
            "https://www.openssl.org/source/openssl-3.3.2.tar.gz"

          # Download Boost
          echo "Downloading Boost..."
          curl -L --retry 3 --connect-timeout 60 -o docker-sources/boost_1_86_0.tar.gz \
            "https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz"

          # Download qBittorrent source
          echo "Downloading qBittorrent ${{ steps.params.outputs.qbt_ref }}..."
          curl -L --retry 3 --connect-timeout 60 \
            -o docker-sources/qbittorrent.tar.gz \
            "https://github.com/qbittorrent/qBittorrent/archive/refs/tags/${{ steps.params.outputs.qbt_ref }}.tar.gz"

          # libtorrent 必须用 git clone: release tarball 不含 deps/try_signal 等
          # git 子模块 (GitHub 自动生成的 archive 不带子模块)
          echo "Cloning libtorrent ${{ steps.params.outputs.lt_ref }}..."
          git clone --depth 1 --branch ${{ steps.params.outputs.lt_ref }} \
            --recursive --shallow-submodules \
            https://github.com/arvidn/libtorrent docker-sources/libtorrent

          # WebUI 统一使用仓库内 apk-project/app/src/main/assets/vuetorrent.zip
          # (VueTorrent 2.34.0 中文默认版, 所有 qb 变体一致, 不按版本切换)

          echo "=== Verifying downloads ==="
          ls -lh docker-sources/
          for f in docker-sources/*.zip docker-sources/*.tar.gz; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              echo "$f: $size bytes"
              if [ "$size" -lt 100000 ]; then
                echo "ERROR: $f is too small, download likely failed"
                exit 1
              fi
            fi
          done

      - name: Prepare source directories
        run: |
          mkdir -p docker-sources/qbittorrent
          tar xzf docker-sources/qbittorrent.tar.gz -C docker-sources/qbittorrent --strip-components=1

          # Android 移植补丁: 共享库化 + JNI 桥接 + LinguistTools 可选化 (+ 线程修复)
          bash ci/apply-patches.sh "${{ matrix.version }}" docker-sources/qbittorrent

          echo "=== Patched source sanity check ==="
          test -f docker-sources/qbittorrent/src/app/android_jni_bridge.cpp
          grep -q "add_library(qbt_app SHARED)" docker-sources/qbittorrent/src/app/CMakeLists.txt
          echo "OK"

      - name: Build Docker image
        run: |
          docker build -t qbittorrent-android:${{ matrix.version }} \
            --build-arg QT_KIND=${{ steps.params.outputs.qt_kind }} \
            --build-arg QT_VERSION=${{ steps.params.outputs.qt_version }} \
            --build-arg CXX_STANDARD=${{ steps.params.outputs.cxx_standard }} \
            --build-arg EXTRA_CMAKE_FLAGS="${{ steps.params.outputs.extra_flags }}" \
            --build-arg EXTRA_LT_CXXFLAGS="${{ steps.params.outputs.extra_lt_flags }}" \
            .

      - name: Extract build artifacts
        run: |
          mkdir -p build-output
          docker create --name qb-out-${{ matrix.version }} qbittorrent-android:${{ matrix.version }}
          # /output/lib 是 Dockerfile 收集的最终产物 (libqbt/libtorrent/Qt 库/插件)
          docker cp qb-out-${{ matrix.version }}:/output/lib/. ./build-output/
          docker rm qb-out-${{ matrix.version }}

          echo "=== Build output ==="
          ls -lh build-output/
          # NDK 工具链可能给目标加 _arm64-v8a 后缀 (qb 4.x), 也可能不加 (qb 5.x)
          ls build-output/libqbt*.so
          test -f build-output/libtorrent-rasterbar.so
          test -f build-output/libc++_shared.so

      - name: Prepare jniLibs
        run: |
          JNILIBS=apk-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNILIBS"
          # 清掉旧库, 防止不同变体间混入过期的 Qt5/Qt6 残留
          rm -f "$JNILIBS"/lib*.so
          # 新编译的 libqbt/libtorrent/libc++_shared
          cp $(ls build-output/libqbt*.so | head -1) "$JNILIBS/libqbt.so"
          cp build-output/libtorrent-rasterbar.so "$JNILIBS/"
          cp build-output/libc++_shared.so "$JNILIBS/"
          # Qt 运行时库 + openssl + 插件: 来自仓库 third-party/<qt_kind>/ (build-qt.yml 产物)
          THIRD=third-party/${{ steps.params.outputs.qt_kind }}/arm64-v8a
          test -d "$THIRD" || { echo "缺少 $THIRD (需先运行 Build Qt runtime libs 并提交产物)"; exit 1; }
          for lib in "$THIRD"/*.so; do
            cp "$lib" "$JNILIBS/"
          done

          echo "=== jniLibs contents ==="
          ls -lh "$JNILIBS"

      - name: Verify native library dependencies
        run: |
          # 对最终 APK 的库集校验: libqbt 的动态依赖必须齐备 (系统库除外)
          JNILIBS=apk-project/app/src/main/jniLibs/arm64-v8a
          cd "$JNILIBS"
          QBT_LIB=$(ls libqbt*.so | head -1)
          echo "=== $QBT_LIB NEEDED ==="
          readelf -d "$QBT_LIB" | grep NEEDED
          missing=0
          for lib in $(readelf -d "$QBT_LIB" | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
            case "$lib" in
              liblog.so|libdl.so|libm.so|libc.so|libz.so) continue ;;
            esac
            # NDK 工具链产物可能带 _arm64-v8a 后缀 (qb 4.x)
            base="${lib%.so}"
            if [ ! -f "$lib" ] && [ ! -f "${base}_arm64-v8a.so" ]; then
              echo "MISSING: $lib"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All non-system dependencies present"


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认装 'tools platform-tools', 但 Google 已下线 'tools' 包,
          # 会以 "Failed to find package 'tools'" + 退出码 1 失败, 故显式指定存在的包
          packages: 'platform-tools'

      - name: Build APK
        run: |
          cd apk-project
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv apk-project/app/build/outputs/apk/release/app-release.apk \
             qbittorrent-android-qb${{ matrix.version }}-${{ steps.version.outputs.version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-android-qb${{ matrix.version }}
          path: qbittorrent-android-qb${{ matrix.version }}-${{ steps.version.outputs.version }}.apk
          retention-days: 90
