name: Tests

# 与构建工作流 (build-android.yml) 分开的自动化测试:
#   1. patch-check:   对各版本 vanilla 源码试打补丁并断言关键标记
#   2. unit-tests:    JVM 单元测试 (./gradlew test)
#   3. emulator-smoke: 构建工作流完成后, 在 Android 模拟器安装 APK,
#      轮询 WebUI 端口并校验 qBittorrent 版本 (端到端冒烟测试)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '构建工作流 run id (emulator-smoke 使用, 留空自动取最近成功构建)'
        required: false
        default: ''
      poll_attempts:
        description: 'WebUI 轮询次数 (每次间隔10秒, 默认20)'
        required: false
        default: '20'
      poll_interval:
        description: 'WebUI 轮询间隔秒数 (默认10)'
        required: false
        default: '10'

  push:
    branches:
      - main
  pull_request:
  workflow_run:
    workflows: ["Build qBittorrent Android APK"]
    types: [completed]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-check:
    name: Patch check (qBittorrent ${{ matrix.version }})
    if: github.event_name != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.3.9'
            qbt_ref: release-4.3.9
          - version: '4.6.7'
            qbt_ref: release-4.6.7
          - version: '5.2.3'
            qbt_ref: release-5.2.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download vanilla source
        run: |
          mkdir -p /tmp/src
          curl -L --retry 3 --connect-timeout 60 \
            -o /tmp/src/qbittorrent.tar.gz \
            "https://github.com/qbittorrent/qBittorrent/archive/refs/tags/${{ matrix.qbt_ref }}.tar.gz"
          mkdir -p /tmp/src/qbittorrent
          tar xzf /tmp/src/qbittorrent.tar.gz -C /tmp/src/qbittorrent --strip-components=1

      - name: Apply patches
        run: bash ci/apply-patches.sh "${{ matrix.version }}" /tmp/src/qbittorrent

      - name: Verify patch markers
        run: |
          cd /tmp/src/qbittorrent
          echo "=== 共享库化 + JNI 桥接 ==="
          grep -q "add_library(qbt_app SHARED)" src/app/CMakeLists.txt
          grep -q "android_jni_bridge.cpp" src/app/CMakeLists.txt
          test -f src/app/android_jni_bridge.cpp
          echo "=== JNI 桥接入口符号 ==="
          grep -q "Java_com_qbittorrent_android_QBittorrentService_nativeMain" src/app/android_jni_bridge.cpp
          echo "=== LinguistTools 可选化 ==="
          ! grep -qE "REQUIRED COMPONENTS .*LinguistTools" cmake/Modules/CheckPackages.cmake src/CMakeLists.txt 2>/dev/null
          grep -q "if (TARGET Qt::lupdate)" src/app/CMakeLists.txt
          echo "=== 翻译 qrc 预编译分支 ==="
          grep -q "webui_translations.qrc" src/app/CMakeLists.txt
          if [ "${{ matrix.version }}" = "5.2.3" ]; then
            echo "=== 5.2.3: rcc 禁用 zstd ==="
            grep -q -- "--no-zstd" cmake/Modules/CommonConfig.cmake
            echo "=== 5.2.3: TorrentDescriptor 异常兜底 (防添加种子/损坏文件闪退) ==="
            # 只统计行首的 catch (注释里也提到 catch (...), 不能用裸 grep -c)
            test "$(grep -c '^catch (const std::exception &err)' src/base/bittorrent/torrentdescriptor.cpp)" = "5"
            test "$(grep -c '^catch (\.\.\.)' src/base/bittorrent/torrentdescriptor.cpp)" = "5"
          fi
          echo "OK: ${{ matrix.version }} 补丁校验通过"

  unit-tests:
    name: JVM unit tests
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认装 'tools platform-tools', 但 Google 已下线 'tools' 包,
          # 会以 "Failed to find package 'tools'" + 退出码 1 失败, 故显式指定存在的包
          packages: 'platform-tools'

      - name: Run unit tests
        run: |
          cd apk-project
          chmod +x gradlew
          # 加了 productFlavors 后 testReleaseUnitTest 有歧义, 用 test 跑全部变体的 JVM 单测
          ./gradlew test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: apk-project/app/build/reports/tests/
          retention-days: 14

  emulator-smoke:
    name: Emulator smoke (qBittorrent ${{ matrix.version }})
    # 仅在构建工作流成功完成后触发 (需要其 APK 产物)
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 三个变体全覆盖: 4.3.9 (Qt5 + libtorrent 1.2) / 4.6.7 (Qt5 长期基线) /
        # 5.2.3 (Qt6 运行时)。qt/libtorrent 用于冒烟测试里断言 buildInfo。
        include:
          - version: '4.3.9'
            qt: '5.15.2'
            libtorrent: '1.2.20'
            pkg: 'com.qbittorrent.android.qb439'
          - version: '4.6.7'
            qt: '5.15.2'
            libtorrent: '2.0.10'
            pkg: 'com.qbittorrent.android.qb467'
          - version: '5.2.3'
            qt: '6.6.3'
            libtorrent: '2.0.14'
            pkg: 'com.qbittorrent.android.qb523'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 模拟器上的 ARM 指令翻译较慢且环境不可控, 暂不作为阻塞门禁
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run
        id: build
        run: |
          RUN_ID="${{ inputs.build_run_id }}"
          # 优先用触发本次测试的那次构建, 避免并发时取到别的 run
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "${{ github.repository }}" --workflow build-android.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # 构建 run 里没有本变体时 (例如只构建了 5.2.3) 跳过本变体, 而不是整轮报错
          if gh run view "$RUN_ID" -R "${{ github.repository }}" --json jobs --jq '.jobs[].name' \
               | grep -qF "qBittorrent ${{ matrix.version }}"; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
            echo "::notice::构建 run $RUN_ID 不含 qBittorrent ${{ matrix.version }}, 跳过本变体"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download APK artifact from build workflow
        if: steps.build.outputs.has_apk == 'true'
        run: |
          echo "Using build run: ${{ steps.build.outputs.run_id }}"
          gh run download "${{ steps.build.outputs.run_id }}" -R "${{ github.repository }}" \
            -n "qbittorrent-android-qb${{ matrix.version }}" -D apk
          ls -lh apk/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Enable KVM
        if: steps.build.outputs.has_apk == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        if: steps.build.outputs.has_apk == 'true'
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认装 'tools platform-tools', 但 Google 已下线 'tools' 包,
          # 会以 "Failed to find package 'tools'" + 退出码 1 失败, 故显式指定存在的包
          packages: 'platform-tools'

      - name: Install emulator and system image
        if: steps.build.outputs.has_apk == 'true'
        run: |
          sdkmanager --install "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" > /dev/null
          echo "y" | sdkmanager --licenses > /dev/null || true

      - name: Start emulator
        if: steps.build.outputs.has_apk == 'true'
        run: |
          # avdmanager 与 emulator 的 AVD home 可能不一致, 显式统一
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n qbt-test \
            -k "system-images;android-30;google_apis;x86_64" -d pixel --force
          avdmanager list avd
          ${ANDROID_HOME}/emulator/emulator -avd qbt-test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on \
            -memory 3072 -cores 2 &
          adb wait-for-device
          echo "Waiting for boot..."
          timeout 600 bash -c 'while [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" != "1" ]; do sleep 5; done'
          echo "Emulator booted"

      - name: Install APK and start app
        if: steps.build.outputs.has_apk == 'true'
        run: |
          adb install -r apk/*.apk
          # 预授权存储权限, 避免 MainActivity 启动时被系统对话框/设置页打断
          adb shell pm grant ${{ matrix.pkg }} android.permission.WRITE_EXTERNAL_STORAGE || true
          adb shell pm grant ${{ matrix.pkg }} android.permission.READ_EXTERNAL_STORAGE || true
          adb forward tcp:18080 tcp:8080
          adb shell am start -W -n ${{ matrix.pkg }}/com.qbittorrent.android.MainActivity
          # 应用初始化需要 10-120 秒 (模拟器上 ARM 翻译更慢)
          sleep 15

      - name: Poll WebUI and verify qBittorrent version
        if: steps.build.outputs.has_apk == 'true'
        run: |
          EXPECTED="${{ matrix.version }}"
          ATTEMPTS="${{ inputs.poll_attempts || '20' }}"
          INTERVAL="${{ inputs.poll_interval || '10' }}"
          echo "polling: $ATTEMPTS attempts x ${INTERVAL}s"
          # 注意: adb forward 后 curl 的 Host 是 localhost:18080, qb 的 Host 头
          # 校验会直接 401, 必须覆盖成应用实际监听的 localhost:8080。
          # 应用默认 LocalHostAuth=false, 来自 127.0.0.1 的请求免认证。
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE=$(curl -s -o /tmp/version.out -w '%{http_code}' --max-time 5 \
              -H "Host: localhost:8080" \
              -H "Referer: http://localhost:8080" \
              http://localhost:18080/api/v2/app/version || echo 000)
            if [ "$CODE" = "200" ]; then
              OK=1
              break
            fi
            echo "attempt $i/$ATTEMPTS: HTTP $CODE"
            sleep "$INTERVAL"
          done
          if [ "$OK" != "1" ]; then
            echo "=== WebUI 未在时限内就绪 ==="
            adb shell "logcat -d | tail -100" || true
            exit 1
          fi
          VERSION=$(cat /tmp/version.out)
          echo "WebUI 就绪, qBittorrent version: $VERSION"
          if [[ "$VERSION" != *"$EXPECTED"* ]]; then
            echo "ERROR: 期望版本 $EXPECTED, 实际 $VERSION"
            exit 1
          fi

      - name: Smoke - 无崩溃标记, 进程未重启
        if: steps.build.outputs.has_apk == 'true'
        run: |
          APP=${{ matrix.pkg }}
          PID1=$(adb shell pidof -s "$APP" | tr -d '\r')
          echo "pid (WebUI 就绪时): $PID1"
          [ -n "$PID1" ] || { echo "::error::应用进程不存在"; exit 1; }
          # 再跑 20 秒: 覆盖"WebUI 能应答但随后才崩"这一类 (本次 5.2.3 崩溃就是启动末期)
          sleep 20
          PID2=$(adb shell pidof -s "$APP" | tr -d '\r')
          echo "pid (20s 后): $PID2"
          [ "$PID1" = "$PID2" ] || { echo "::error::进程被重启过 ($PID1 -> $PID2)"; exit 1; }

          adb shell logcat -d > logcat-smoke.txt
          echo "本进程日志行数: $(awk -v p="$PID2" '$3==p' logcat-smoke.txt | wc -l)"
          # 只看本进程 (pid 列) 的行, 避免设备上其他应用的报错误伤
          if awk -v p="$PID2" '$3==p' logcat-smoke.txt | grep -E "JNI DETECTED|Fatal signal|SIGABRT|Abort message|FATAL EXCEPTION"; then
            echo "::error::logcat 中出现本进程的致命错误 (见上方)"
            exit 1
          fi
          if grep -qE "Scheduling restart of crashed service ${APP}" logcat-smoke.txt; then
            echo "::error::Service 被系统按崩溃重启过"
            exit 1
          fi
          # Qt 插件必须已加载 (JNI 桥接里设置 QT_PLUGIN_PATH + 注入 CA 证书, 见 android_jni_bridge.cpp)。
          # 出现这句话说明 libplugins_tls_* 没被加载, 那么所有走 Qt 网络栈的 https 都会失败
          # (按 URL 添加种子、RSS、GeoIP 下载等), 所以这里当硬错误处理。
          if grep -q "No functional TLS backend was found" logcat-smoke.txt; then
            echo "::error::Qt 没有可用的 TLS 后端 —— tls 插件没有被加载"
            grep -m3 "No functional TLS backend was found" logcat-smoke.txt
            exit 1
          fi
          echo "OK: Qt TLS 后端已加载"
          echo "OK: 无崩溃标记, 进程未重启"

      - name: Smoke - buildInfo / preferences / VueTorrent 断言
        if: steps.build.outputs.has_apk == 'true'
        run: |
          BASE=http://localhost:18080
          # qb 会校验 Host 头; 部分请求还要同源 Referer/Origin
          HOSTH=(-H "Host: localhost:8080" -H "Referer: http://localhost:8080")
          EXPECT_QT="${{ matrix.qt }}"
          EXPECT_LT="${{ matrix.libtorrent }}"

          echo "=== buildInfo: 变体的 Qt / libtorrent 版本必须与矩阵一致 ==="
          CODE=$(curl -s -o /tmp/bi.json -w '%{http_code}' --max-time 15 "${HOSTH[@]}" "$BASE/api/v2/app/buildInfo")
          echo "buildInfo HTTP $CODE"; cat /tmp/bi.json; echo
          [ "$CODE" = "200" ] || { echo "::error::buildInfo 返回 HTTP $CODE (403 通常是认证问题)"; exit 1; }
          BI_QT=$(jq -r '.qt // empty' /tmp/bi.json)
          BI_LT=$(jq -r '.libtorrent // empty' /tmp/bi.json)
          [[ "$BI_QT" == *"$EXPECT_QT"* ]] || { echo "::error::Qt 版本不符: 期望含 $EXPECT_QT, 实际 '$BI_QT'"; exit 1; }
          [[ "$BI_LT" == *"$EXPECT_LT"* ]] || { echo "::error::libtorrent 版本不符: 期望含 $EXPECT_LT, 实际 '$BI_LT'"; exit 1; }

          echo "=== preferences: Java 层启动时写入的配置 ==="
          CODE=$(curl -s -o /tmp/prefs.json -w '%{http_code}' --max-time 15 "${HOSTH[@]}" "$BASE/api/v2/app/preferences")
          echo "preferences HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::preferences 返回 HTTP $CODE (403 通常是认证问题)"; exit 1; }
          jq -r '"web_ui_port=\(.web_ui_port) alternative_webui_enabled=\(.alternative_webui_enabled) save_path=\(.save_path)"' /tmp/prefs.json
          [ "$(jq -r '.web_ui_port' /tmp/prefs.json)" = "8080" ] \
            || { echo "::error::web_ui_port 不是 8080"; exit 1; }
          [ "$(jq -r '.alternative_webui_enabled' /tmp/prefs.json)" = "true" ] \
            || { echo "::error::alternative_webui_enabled 未开启"; exit 1; }
          SAVE_PATH=$(jq -r '.save_path // empty' /tmp/prefs.json)
          [ -n "$SAVE_PATH" ] || { echo "::error::save_path 为空"; exit 1; }

          echo "=== 根路径应返回 VueTorrent 页面 (验证 zip 解压 + alt UI 生效) ==="
          CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 15 "${HOSTH[@]}" "$BASE/")
          echo "GET / HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::GET / 返回 HTTP $CODE"; exit 1; }
          grep -qi "vuetorrent" /tmp/index.html \
            || { echo "::error::/ 不是 VueTorrent 页面, 前 200 字节: $(head -c 200 /tmp/index.html)"; exit 1; }
          grep -qi "<title>VueTorrent</title>" /tmp/index.html \
            || echo "::warning::页面里没有 <title>VueTorrent</title>, 可能只命中了部分资源"
          echo "OK: 变体参数 / 配置 / VueTorrent 断言通过 (save_path=$SAVE_PATH)"

      - name: Smoke - 种子 添加/暂停/恢复/删除 往返
        if: steps.build.outputs.has_apk == 'true'
        run: |
          BASE=http://localhost:18080
          HOSTH=(-H "Host: localhost:8080" -H "Referer: http://localhost:8080")
          PKG="${{ matrix.pkg }}"
          PID_BEFORE=$(adb shell pidof -s "$PKG" | tr -d '\r')
          echo "pid before: $PID_BEFORE"

          HASH=$(python3 ci/make-test-torrent.py /tmp/smoke.torrent)
          echo "test torrent info-hash: $HASH"

          echo "=== 1) 添加种子 (multipart 上传 .torrent) ==="
          CODE=$(curl -s -o /tmp/add.out -w '%{http_code}' --max-time 30 "${HOSTH[@]}" \
            -F "torrents=@/tmp/smoke.torrent;type=application/x-bittorrent" \
            "$BASE/api/v2/torrents/add")
          echo "torrents/add HTTP $CODE -> $(cat /tmp/add.out)"
          [ "$CODE" = "200" ] || { echo "::error::添加种子返回 HTTP $CODE"; exit 1; }

          echo "=== 2) 确认种子出现在 /torrents/info ==="
          INFO=""
          FOUND=0
          for i in $(seq 1 10); do
            INFO=$(curl -s --max-time 15 "${HOSTH[@]}" "$BASE/api/v2/torrents/info")
            if echo "$INFO" | jq -e --arg h "$HASH" 'map(select(.hash == $h)) | length > 0' > /dev/null 2>&1; then
              FOUND=1; break
            fi
            echo "attempt $i: 还没出现"
            sleep 3
          done
          if [ "$FOUND" != "1" ]; then
            echo "::error::种子未出现在 /torrents/info"; echo "$INFO" | head -c 400; exit 1
          fi
          echo "$INFO" | jq -r --arg h "$HASH" '.[] | select(.hash==$h) | "name=\(.name) state=\(.state) size=\(.size) progress=\(.progress)"'

          echo "=== 3) 暂停 / 恢复 ==="
          curl -s --max-time 15 "${HOSTH[@]}" -d "hashes=$HASH" "$BASE/api/v2/torrents/pause" > /dev/null
          sleep 2
          STATE=$(curl -s --max-time 15 "${HOSTH[@]}" "$BASE/api/v2/torrents/info" \
            | jq -r --arg h "$HASH" '.[] | select(.hash==$h) | .state')
          echo "pause 后 state=$STATE"
          [[ "$STATE" == paused* ]] || { echo "::error::暂停未生效 (state=$STATE)"; exit 1; }
          curl -s --max-time 15 "${HOSTH[@]}" -d "hashes=$HASH" "$BASE/api/v2/torrents/resume" > /dev/null

          echo "=== 4) 删除 ==="
          curl -s --max-time 15 "${HOSTH[@]}" -d "hashes=$HASH&deleteFiles=false" \
            "$BASE/api/v2/torrents/delete" > /dev/null
          sleep 2
          LEFT=$(curl -s --max-time 15 "${HOSTH[@]}" "$BASE/api/v2/torrents/info" \
            | jq -r --arg h "$HASH" 'map(select(.hash==$h)) | length')
          [ "$LEFT" = "0" ] || { echo "::error::删除后种子仍在列表里"; exit 1; }

          echo "=== 5) 进程与 logcat 复检 (添加种子后是否崩) ==="
          PID_AFTER=$(adb shell pidof -s "$PKG" | tr -d '\r')
          echo "pid after: $PID_AFTER"
          [ "$PID_BEFORE" = "$PID_AFTER" ] || { echo "::error::种子操作过程中进程被重启 ($PID_BEFORE -> $PID_AFTER)"; exit 1; }
          adb shell logcat -d > logcat-torrent.txt
          if awk -v p="$PID_AFTER" '$3==p' logcat-torrent.txt \
               | grep -E "JNI DETECTED|Fatal signal|SIGABRT|Abort message|FATAL EXCEPTION"; then
            echo "::error::种子操作后 logcat 出现本进程致命错误 (见上方)"; exit 1
          fi
          echo "OK: 添加/暂停/恢复/删除 往返通过"

      - name: Smoke - 非法输入只报错不崩溃 (URL/畸形磁力/损坏文件)
        if: steps.build.outputs.has_apk == 'true'
        run: |
          # 回归测试: 这三类输入曾在 5.2.3 上直接 SIGABRT (libtorrent 抛出的
          # boost/system 异常跨 DSO 时 qb 的 catch 匹配不上 -> std::terminate)。
          # 修复见 ci/patches/5.2.3/050-torrentdescriptor-catchall.patch。
          BASE=http://localhost:18080
          HOSTH=(-H "Host: localhost:8080" -H "Referer: http://localhost:8080")
          PKG="${{ matrix.pkg }}"
          PID_BEFORE=$(adb shell pidof -s "$PKG" | tr -d '\r')
          echo "pid before: $PID_BEFORE"

          check_not_crash() {
            local label="$1" code="$2" body_file="$3"
            echo "$label -> HTTP $code: $(head -c 120 "$body_file" 2>/dev/null)"
            [ "$code" != "000" ] || { echo "::error::$label 请求没有响应 (进程多半已经崩了)"; exit 1; }
          }

          echo "=== 1) 按 URL 添加 (https 无 TLS 后端, 应报错) ==="
          CODE=$(curl -s -o /tmp/url.out -w '%{http_code}' --max-time 20 "${HOSTH[@]}" \
            --data-urlencode "urls=https://example.com/not-a-real.torrent" \
            "$BASE/api/v2/torrents/add")
          check_not_crash "按 URL 添加" "$CODE" /tmp/url.out

          echo "=== 2) 畸形磁力 (libtorrent 抛 invalid info-hash) ==="
          CODE=$(curl -s -o /tmp/magnet.out -w '%{http_code}' --max-time 20 "${HOSTH[@]}" \
            --data-urlencode "urls=magnet:?xt=urn:btih:not_a_valid_hash" \
            "$BASE/api/v2/torrents/add")
          check_not_crash "畸形磁力" "$CODE" /tmp/magnet.out

          echo "=== 3) 损坏的 .torrent 文件 (libtorrent 抛 bdecode 错误) ==="
          head -c 2000 /dev/urandom > /tmp/garbage.torrent
          CODE=$(curl -s -o /tmp/garbage.out -w '%{http_code}' --max-time 20 "${HOSTH[@]}" \
            -F "torrents=@/tmp/garbage.torrent;type=application/x-bittorrent" \
            "$BASE/api/v2/torrents/add")
          check_not_crash "损坏文件" "$CODE" /tmp/garbage.out

          echo "=== 4) 优雅失败要落到 qb 日志里 (而不是被静默吞掉) ==="
          LOGS=$(curl -s --max-time 15 "${HOSTH[@]}" \
            "$BASE/api/v2/log/main?normal=true&info=true&warning=true&critical=true")
          for needle in "not-a-real.torrent" "not_a_valid_hash"; do
            if echo "$LOGS" | grep -q "$needle"; then
              echo "  qb 日志里有 $needle 的添加失败记录"
            else
              echo "::error::qb 日志里找不到 $needle 的失败记录 (可能被静默吞掉)"
              exit 1
            fi
          done

          echo "=== 5) 进程与 logcat 复检 ==="
          sleep 5
          PID_AFTER=$(adb shell pidof -s "$PKG" | tr -d '\r')
          echo "pid after: $PID_AFTER"
          [ "$PID_BEFORE" = "$PID_AFTER" ] || { echo "::error::进程被重启 ($PID_BEFORE -> $PID_AFTER)"; exit 1; }
          adb shell logcat -d > logcat-invalid.txt
          if awk -v p="$PID_AFTER" '$3==p' logcat-invalid.txt \
               | grep -E "JNI DETECTED|Fatal signal|SIGABRT|Abort message|FATAL EXCEPTION"; then
            echo "::error::非法输入导致本进程致命错误 (见上方)"; exit 1
          fi
          echo "OK: 非法输入只返回错误, 没有崩溃"

      - name: Collect logs on failure
        if: failure() && steps.build.outputs.has_apk == 'true'
        run: |
          adb shell "logcat -d" > logcat.txt || true
          adb shell "cat /data/data/${{ matrix.pkg }}/files/*.txt" >> logcat.txt || true
          tail -300 logcat.txt

      - name: Upload failure logs
        if: failure() && steps.build.outputs.has_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-qb${{ matrix.version }}
          path: logcat.txt
          retention-days: 14
